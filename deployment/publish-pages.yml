# Install as .github/workflows/publish-pages.yml in the organization website repo.
name: Publish atlas from data repository

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public atlas source
        uses: actions/checkout@v4
        with:
          repository: ghazanPK/Co-Speech-gesture-atlas
          ref: main
          persist-credentials: false

      - name: Record source version
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          Path('.atlas-source-sha').write_text(sha, encoding='utf-8')
          print(f'Building source {sha}')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and build website
        run: |
          python scripts/validate.py
          python scripts/build_site.py
          touch docs/.nojekyll
          cp LICENSE LICENSE-DATA docs/
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path
          metadata = {
              'source_repository': 'ghazanPK/Co-Speech-gesture-atlas',
              'source_commit': Path('.atlas-source-sha').read_text().strip(),
              'built_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          Path('docs/deployment.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
