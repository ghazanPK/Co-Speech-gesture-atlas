# Install as .github/workflows/publish-pages.yml in the organization website repo.
name: Publish atlas from data repository

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pages.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - name: Check out public atlas source
        uses: actions/checkout@v4
        with:
          repository: ghazanPK/Co-Speech-gesture-atlas
          ref: main
          persist-credentials: false

      - name: Compare source with published version
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          changed = True
          if os.environ['EVENT_NAME'] == 'schedule':
              try:
                  request = urllib.request.Request(
                      'https://co-speech-gesture-atlas.github.io/deployment.json',
                      headers={'Cache-Control': 'no-cache'},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      previous = json.load(response)
                  changed = previous.get('source_commit') != sha
              except (OSError, ValueError):
                  pass  # Initial deployment or unavailable metadata: rebuild.
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'changed={str(changed).lower()}\n')
          Path('.atlas-source-sha').write_text(sha, encoding='utf-8')
          print(f'Source {sha}; build required: {changed}')
          PY

      - name: Set up Python
        if: steps.source.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.source.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt
      - name: Validate and build website
        if: steps.source.outputs.changed == 'true'
        run: |
          python scripts/validate.py
          python scripts/build_site.py
          touch docs/.nojekyll
          cp LICENSE LICENSE-DATA docs/
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path
          metadata = {
              'source_repository': 'ghazanPK/Co-Speech-gesture-atlas',
              'source_commit': Path('.atlas-source-sha').read_text().strip(),
              'built_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          Path('docs/deployment.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload website artifact
        if: steps.source.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
