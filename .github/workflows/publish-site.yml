name: Validate and publish atlas site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/build_site.py

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger organization website deployment
        env:
          GH_TOKEN: ${{ secrets.ATLAS_PAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set ATLAS_PAGES_TOKEN in this repository. See DEPLOYMENT.md.'
            exit 1
          fi
          gh api --method POST \
            repos/co-speech-gesture-atlas/co-speech-gesture-atlas.github.io/actions/workflows/publish-pages.yml/dispatches \
            -f ref=main
