  summary: 97 hours of upper-body gesture from 1,766 TED talk videos, with OpenPose 2D poses lifted to 3D (10 upper-body joints) and aligned to speech audio and transcripts.
  notes: The 3D-extended version from Yoon et al., SIGGRAPH Asia 2020 (trimodal context), which added 471 videos to the 2019 ICRA TED dataset (see youtube-gesture). Videos are not distributed; video IDs are provided. Speaker count and language not stated on the pages read.
