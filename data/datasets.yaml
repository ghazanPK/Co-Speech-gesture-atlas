# One record per dataset. Papers refer to these by `id` in their `datasets` field.
# Field rules: docs/SCHEMA.md (enforced by schema/schema.json and scripts/validate.py).

- id: trinity
  year: 2018
  links: {paper: 'http://www.tara.tcd.ie/handle/2262/91094'}
  representation: [joints-3d]
  setting: [monologue]
  languages: [en]
  summary: About 244 minutes of audio and 20-camera Vicon motion capture (69-joint skeleton) of one male actor speaking freely on various topics.
  notes: Ferstl and McDonnell, IVA 2018. Sources give 244 or 242 minutes. Finger motion is of poor quality and was dropped in GENEA 2020. Download is through a portal after agreeing to the licence.
  added: '2026-10-02'
  verified: false
  name: Trinity Speech-Gesture Dataset
  modalities: [audio, body-motion, hand-motion]
  capture: mocap
  hours: 4.07
  speakers: 1
  access: on-request
  license: Non-commercial research licence from Trinity College Dublin (non-exclusive, non-transferable, research into speech gesture only)

- id: trinity2
  links: {}
  representation: [joints-3d]
  setting: [monologue]
  languages: [en]
  summary: Six hours of time-aligned 44 kHz audio and 120 fps marker-based motion capture of one male Hiberno-English actor speaking and gesturing spontaneously to a person behind the camera.
  notes: Recorded at Trinity College Dublin by Ferstl, Neff and McDonnell; cited in later work (e.g. Diff-TTSG) to their 2020-2021 papers, so the release year is not pinned down. Download folder holds Audio, Motion and Gesture_segmentation plus AlignmentTimes.csv. Finger motion exists but is reported as unreliable. Access is after accepting the license on the site.
  added: '2026-10-02'
  verified: false
  name: Trinity Speech-Gesture Dataset II (TSGD2)
  modalities: [audio, body-motion, hand-motion, annotations]
  capture: mocap
  hours: 6
  speakers: 1
  access: open
  license: Dataset Copyright License for non-commercial scientific research purposes

- id: ted-gesture
