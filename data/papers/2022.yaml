- id: zhou2022reenactment
  title: Audio-driven Neural Gesture Reenactment with Video Motion Graphs
  authors: [Yang Zhou, Jimei Yang, Dingzeyu Li, Jun Saito, Deepali Aneja, Evangelos Kalogerakis]
  year: 2022
  venue: CVPR
  type: conference
  category: method
  doi: 10.1109/cvpr52688.2022.00341
  arxiv: '2207.11524'
  links: {paper: 'https://openaccess.thecvf.com/content/CVPR2022/html/Zhou_Audio-Driven_Neural_Gesture_Reenactment_With_Video_Motion_Graphs_CVPR_2022_paper.html', open: 'https://arxiv.org/abs/2207.11524', code: 'https://github.com/yzhou359/vid-reenact', project: 'https://yzhou359.github.io/video_reenact'}
  input: [audio, video]
  output: [upper-body, hands]
  representation: [video-pixels]
  approach: [retrieval]
