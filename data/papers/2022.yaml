  authors: [Youngwoo Yoon, Pieter Wolfert, Taras Kucherenko, Carla Viegas, Teodor Nikolov, Mihail Tsakov, Gustav Eje Henter]
  year: 2022
  venue: ICMI
  type: conference
  category: challenge
  doi: 10.1145/3536221.3558058
  arxiv: '2208.10441'
  links: {paper: 'https://doi.org/10.1145/3536221.3558058', open: 'https://arxiv.org/abs/2208.10441', project: 'https://youngwoo-yoon.github.io/GENEAchallenge2022/'}
  output: [upper-body, full-body, hands]
  representation: [joints-3d]
  realtime: unreported
  datasets: [genea-2022, talking-with-hands]
  languages: [en]
