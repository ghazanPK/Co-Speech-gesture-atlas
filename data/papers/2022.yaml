- id: liu2022ha2g
  title: Learning Hierarchical Cross-Modal Association for Co-Speech Gesture Generation
  authors: [Xian Liu, Qianyi Wu, Hang Zhou, Yinghao Xu, Rui Qian, Xinyi Lin, Xiaowei Zhou, Wayne Wu, Bo Dai, Bolei Zhou]
  year: 2022
  venue: CVPR
  type: conference
  category: method
  doi: 10.1109/cvpr52688.2022.01021
  arxiv: '2203.13161'
  links: {paper: 'https://doi.org/10.1109/cvpr52688.2022.01021', open: 'https://arxiv.org/abs/2203.13161', code: 'https://github.com/alvinliu0/HA2G', project: 'https://alvinliu0.github.io/projects/HA2G'}
  input: [audio, speaker-id]
  output: [upper-body, hands]
  representation: [joints-3d]
  approach: [regression]
  setting: [monologue]
  realtime: unreported
  datasets: [ted-gesture, ted-expressive]
  languages: [en]
  metrics: [fgd, beat-align, diversity]
  user_study: true
