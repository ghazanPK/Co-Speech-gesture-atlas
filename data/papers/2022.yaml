- id: teshima2022typespecific
  title: Deep Gesture Generation for Social Robots Using Type-Specific Libraries
  authors: [Hitoshi Teshima, Naoki Wake, Diego Thomas, Yuta Nakashima, Hiroshi Kawasaki, Katsushi Ikeuchi]
  year: 2022
  venue: IROS
  type: conference
  category: method
  doi: 10.1109/iros47612.2022.9981734
  arxiv: '2210.06790'
  links: {paper: 'https://doi.org/10.1109/iros47612.2022.9981734', open: 'https://arxiv.org/abs/2210.06790'}
  input: [text]
  output: [upper-body]
  representation: [joints-3d]
  approach: [hybrid, retrieval]
  realtime: unreported
  datasets: [ted-gesture, trinity]
  languages: [en]
  metrics: [other]
  user_study: true
  summary: Classifies each word as imagistic, beat or no gesture with a BERT classifier, then retrieves and blends gestures from type-specific libraries built on TED data for avatars and humanoid robots.
