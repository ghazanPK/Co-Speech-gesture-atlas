- id: yazdian2022gesture2vec
  title: 'Gesture2Vec: Clustering Gestures using Representation Learning Methods for Co-speech Gesture Generation'
  authors: [Payam Jome Yazdian, Mo Chen, Angelica Lim]
  year: 2022
  venue: IROS
  type: conference
  category: method
  doi: 10.1109/iros47612.2022.9981117
  links: {paper: 'https://doi.org/10.1109/iros47612.2022.9981117', code: 'https://github.com/pjyazdian/Gesture2Vec'}
  input: [text]
  approach: [vq, vae]
  user_study: true
