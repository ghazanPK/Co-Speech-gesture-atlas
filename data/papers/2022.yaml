- id: ao2022rhythmic
  title: 'Rhythmic Gesticulator: Rhythm-Aware Co-Speech Gesture Synthesis with Hierarchical Neural Embeddings'
  authors: [Tenglong Ao, Qingzhe Gao, Yuke Lou, Baoquan Chen, Libin Liu]
  year: 2022
  venue: TOG
  type: journal
  category: method
  doi: 10.1145/3550454.3555435
  arxiv: '2210.01448'
  links: {paper: 'https://doi.org/10.1145/3550454.3555435', open: 'https://arxiv.org/abs/2210.01448', project: 'https://pku-mocca.github.io/Rhythmic-Gesticulator-Page/'}
  input: [audio, text, speaker-id]
  output: [upper-body, hands]
  representation: [joints-3d]
  approach: [vq, autoregressive]
  setting: [monologue]
  realtime: unreported
  datasets: [trinity, ted-gesture, custom]
  languages: [en, zh]
  metrics: [joint-error, accel-jerk, fgd, other]
  user_study: true
  summary: Synthesises co-speech gestures with a rhythm-based segmentation pipeline and hierarchical speech and motion embeddings, using a VQ gesture lexicon and an LSTM generator.
  notes: Other metric is the percentage of matched beats (PMB). Introduces a 4-hour Chinese gesture dataset.
