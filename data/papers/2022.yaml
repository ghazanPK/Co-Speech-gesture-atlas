- id: yang2022reprgesture
  title: The ReprGesture entry to the GENEA Challenge 2022
  authors: [Sicheng Yang, Zhiyong Wu, Minglei Li, Mengchen Zhao, Jiuxin Lin, Liyang Chen, Weihong Bao]
  year: 2022
  venue: ICMI
  type: conference
  category: method
  doi: 10.1145/3536221.3558066
  arxiv: '2208.12133'
  links: {paper: 'https://doi.org/10.1145/3536221.3558066', open: 'https://arxiv.org/abs/2208.12133', code: 'https://github.com/YoungSeng/ReprGesture'}
  input: [audio, text, seed-motion]
  output: [upper-body]
  representation: [joints-3d]
  approach: [gan]
  realtime: unreported
  datasets: [genea-2022, talking-with-hands]
  metrics: [accel-jerk, cca, velocity-hist, fgd]
  user_study: true
