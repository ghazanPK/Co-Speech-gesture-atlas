- id: abel2025stargate
  title: 'Co-speech gesture synthesis : Towards a controllable and interpretable model using a graph deterministic approach'
  authors: [Louis Abel]
  year: 2025
  venue: PhD thesis
  type: thesis
  category: method
  doi: 10.70675/4b4d1808z33d7z4b7bz830bz71052e2093c2
  links: {paper: 'https://doi.org/10.70675/4b4d1808z33d7z4b7bz830bz71052e2093c2'}
