  input: [audio, text, seed-motion]
  output: [full-body]
  representation: [smpl-x]
  approach: [vae, diffusion, autoregressive]
  setting: [monologue]
  realtime: unreported
  datasets: [beat2, embody3d, sceneges]
  metrics: [fgd, beat-align, diversity, joint-error, other]
  user_study: true
