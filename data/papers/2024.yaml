- id: abel2024realtime
  title: Towards realtime co-speech gestures synthesis using STARGATE
  authors: [Louis Abel, Vincent Colotte, Slim Ouni]
  year: 2024
  venue: Interspeech
  type: conference
  category: method
  doi: 10.21437/interspeech.2024-302
  links: {paper: 'https://doi.org/10.21437/interspeech.2024-302', open: 'https://hal.science/hal-04667107/document'}
  input: [text, audio, seed-motion]
  representation: [joints-3d]
  approach: [autoregressive]
  setting: [monologue]
  realtime: real-time
  latency: 6.51 s to generate a 5 s sequence and 23.78 s for 80 s (raw waveform and sentence input, batch size 1, i7-11850H with RTX A3000 laptop GPU); 60 fps output
  datasets: [beat]
  metrics: [fgd]
  user_study: true
  summary: A chunked autoregressive encoder-decoder that generates gestures from audio, BERT text embeddings and past motion, using spatio-temporal graph convolutions with attention for the motion history and GRUs for decoding.
  notes: Trained on speaker 1 of BEAT only (about 4 hours); compared with StyleGestures using FGD, inference time and a MOS study with 25 participants.
  added: '2026-10-03'
  checked: full-text
  verified: false

