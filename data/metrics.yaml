# One record per objective evaluation metric. Papers refer to these by `id` in
# their `metrics` field; human evaluation is recorded with `user_study` instead.
# Field rules: docs/SCHEMA.md (enforced by schema/schema.json and scripts/validate.py).

- id: fgd
  added: '2026-10-02'
  verified: false
  name: Fréchet Gesture Distance
  aka: [FGD]

- id: fid
  added: '2026-10-02'
  verified: false
  name: Fréchet Inception Distance (on motion or image features)
  aka: [FID]

- id: fvd
  added: '2026-10-02'
  verified: false
  name: Fréchet Video Distance
  aka: [FVD]

- id: fmd
  added: '2026-10-02'
  verified: false
  name: Fréchet Motion Distance
  aka: [FMD]

- id: beat-align
  added: '2026-10-02'
  verified: false
  name: Beat Alignment / Beat Consistency
  aka: [BeatAlign, BA, BC, Beat Consistency Score]

- id: diversity
  added: '2026-10-02'
  verified: false
  name: Diversity (average feature or pose distance between generated clips)
  aka: [Div]

- id: l1-div
  added: '2026-10-02'
  verified: false
  name: L1 Diversity
  aka: [L1div]

- id: multimodality
  added: '2026-10-02'
  verified: false
  name: Multimodality (variation for the same input)
  aka: [MM]

- id: srgr
  added: '2026-10-02'
  verified: false
  name: Semantic-Relevant Gesture Recall
  aka: [SRGR]

- id: joint-error
  added: '2026-10-02'
  verified: false
  name: Joint position or rotation error against ground truth
  aka: [MAE, APE, MPJPE, L1, MSE]

- id: pck
  added: '2026-10-02'
  verified: false
  name: Percentage of Correct Keypoints
  aka: [PCK]

- id: accel-jerk
  added: '2026-10-02'
  verified: false
  name: Acceleration and jerk statistics
  aka: [MAJE, MAD, Jerk]

- id: velocity-hist
  added: '2026-10-02'
  verified: false
  name: Velocity histogram distance (Hellinger distance)
  aka: [HD]

- id: cca
  added: '2026-10-02'
  verified: false
  name: Canonical Correlation Analysis against ground truth
  aka: [CCA]

- id: face-error
  added: '2026-10-02'
  verified: false
  name: Face vertex or blendshape error
  aka: [LVD, MSE (face), vertex MSE]

- id: r-precision
  added: '2026-10-02'
  verified: false
  name: Retrieval precision of motion from text or speech
  aka: [R-Precision]

- id: image-quality
  added: '2026-10-02'
  verified: false
  name: Frame-level image quality
  aka: [PSNR, SSIM, LPIPS]

- id: lip-sync
  added: '2026-10-02'
  verified: false
  name: Lip synchronisation confidence or distance
  aka: [Sync-C, Sync-D, LSE-C, LSE-D]

- id: gca
  added: '2026-10-02'
  verified: false
  name: Gesture Cluster Affinity
  aka: [GCA]

- {id: other, added: '2026-10-02', verified: false, name: A metric not yet listed here; named in the paper record's notes}

- {id: workspace-violation, added: '2026-10-02', verified: false, name: Workspace Violation}

- {id: retrieval-recall, added: '2026-10-02', verified: false, name: 'Retrieval Recall@K (R@1, R@5, R@10)'}

- {id: smooth-bc, added: '2026-10-02', verified: false, name: Smooth Beat Consistency (Smooth-BC)}
