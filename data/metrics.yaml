- id: identity-similarity
  added: '2026-10-03'
  verified: false
  name: Facial identity similarity
  aka: [CSIM, identity similarity, identity cosine similarity, facial identity similarity]
  measures: accuracy
  better: higher

- id: e-fid
  added: '2026-10-03'
